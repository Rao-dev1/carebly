{% extends "base.html" %}
{% block content %}
<div class="auth-container">
  <div class="login-card">
    <h1>Register Patient</h1>

    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label>Full Name *</label>
        <input type="text" name="name" required>
      </div>

      <div class="form-group">
        <label>Email *</label>
        <input type="email" name="email" required>
      </div>

      <div class="form-group">
        <label>Password *</label>
        <input type="password" name="password" minlength="8" required>
      </div>

      <div class="form-group">
        <label>Mobile Number (WhatsApp) *</label>
        <input type="tel" name="phone" placeholder="98765 43210" required>
      </div>

      <div class="form-group">
        <label style="font-weight:normal;">
          <input type="checkbox" name="whatsapp_opt_in" value="1" checked>
          Send me appointment updates and reminders on WhatsApp
        </label>
      </div>

      <div class="form-group">
        <label>Age</label>
        <input type="number" name="age" min="18">
      </div>

      <div class="form-group">
        <label>Gender</label>
        <select name="gender">
          <option value="">Select</option>
          <option>Male</option>
          <option>Female</option>
          <option>Other</option>
        </select>
      </div>

      <div class="form-group">
        <label>Blood Group</label>
        <select name="blood_group">
          <option value="">Select</option>
          <option>A+</option><option>A-</option>
          <option>B+</option><option>B-</option>
          <option>AB+</option><option>AB-</option>
          <option>O+</option><option>O-</option>
        </select>
      </div>

      <button class="btn btn-primary" type="submit">Register</button>
    </form>
  </div>
</div>
{% endblock %}
