{% extends "base.html" %}
{% block content %}
<div class="main-content">
  <h1>Add Notes for Appointment {{ appt.id }}</h1>
  <p>Patient: {{ appt.patient_name }} | Date & Time: {{ appt.date_time }}</p>

  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
      <label>Diagnosis</label>
      <textarea name="diagnosis" rows="2" style="width:100%;" required></textarea>
    </div>

    <div class="form-group">
      <label>Notes</label>
      <textarea name="notes" rows="4" style="width:100%;"></textarea>
    </div>

    <div class="form-group">
      <label>Schedule next visit after (days)</label>
      <input type="number" name="followup_days" min="0" value="0">
      <small>0 = no automatic next appointment</small>
    </div>

    <button class="btn-primary" type="submit">Save to History</button>
  </form>
</div>
{% endblock %}
